<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rs-gate 控制台与自服务门户</title>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <link rel="stylesheet" href="/styles/components.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">RS</div>
        <span class="sidebar-title">rs-gate</span>
        <span class="sidebar-badge">Gateway</span>
      </div>

      <nav class="sidebar-nav">
        <!-- Developer Portal Section -->
        <div class="nav-section-title">开发者自服务</div>
        <a href="/portal/keys" class="nav-item active" data-link>
          <span>🔑</span>
          <span>我的 API Keys</span>
        </a>
        <a href="/portal/usage" class="nav-item" data-link>
          <span>📊</span>
          <span>用量与配额</span>
        </a>
        <a href="/portal/models" class="nav-item" data-link>
          <span>🤖</span>
          <span>模型广场与接入</span>
        </a>
        <a href="/portal/audits" class="nav-item" data-link>
          <span>📝</span>
          <span>个人调用流水</span>
        </a>

        <!-- Admin Ops Section -->
        <div id="admin-nav-section">
          <div class="nav-section-title">运维与集群治理</div>
          <a href="/admin/dashboard" class="nav-item" data-link>
            <span>📈</span>
            <span>集群监控大盘</span>
          </a>
          <a href="/admin/backends" class="nav-item" data-link>
            <span>🖥️</span>
            <span>物理后端实例</span>
          </a>
          <a href="/admin/models" class="nav-item" data-link>
            <span>🔀</span>
            <span>逻辑模型集群</span>
          </a>
          <a href="/admin/keys" class="nav-item" data-link>
            <span>🛡️</span>
            <span>全局虚拟 Key</span>
          </a>
          <a href="/admin/audits" class="nav-item" data-link>
            <span>📜</span>
            <span>全量调用审计</span>
          </a>
          <a href="/admin/users" class="nav-item" data-link>
            <span>👥</span>
            <span>用户与权限</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div id="user-avatar" class="user-avatar">U</div>
          <div class="user-meta">
            <span id="user-display-name" class="user-name">开发者</span>
            <span id="user-role-badge" class="user-role-badge">user</span>
          </div>
        </div>
        <button id="logout-btn" class="btn btn-secondary btn-sm" title="退出登录">退出</button>
      </div>
    </aside>

    <!-- Main Viewport -->
    <main class="main-viewport">
      <header class="topbar">
        <h1 id="topbar-title" class="topbar-title">我的 API Keys</h1>
      </header>

      <div id="main-content" class="content-container">
        <!-- Dynamic views will be rendered here -->
      </div>
    </main>
  </div>

  <!-- Global Modals & Toast Containers -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div id="modal-container" class="modal-panel"></div>
  </div>
  <div id="toast-container"></div>

  <script type="module" src="/scripts/app.js"></script>
</body>
</html>
