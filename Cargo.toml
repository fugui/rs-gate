[package]
name = "rs-gate"
version = "0.1.0"
edition = "2021"
authors = ["fugui <fugui@users.noreply.github.com>"]
description = "Lightweight, single-binary enterprise LLM API gateway written in Rust"
license = "Apache-2.0"

[lib]
name = "rs_gate"
path = "src/lib.rs"

[[bin]]
name = "rs-gate"
path = "src/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1.43", features = ["full"] }

# Web Framework & HTTP
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database & SQLite Storage Engine
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
config = "0.15"

# Observability & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Security, Hashing & Crypto
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
subtle = "2.6"

# Error Handling & Utilities
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.11", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }

# Routing, Proxying & Concurrency
reqwest = { version = "0.12", features = ["json", "stream"] }
arc-swap = "1.7"
futures-util = "0.3"
tokio-util = "0.7"
async-stream = "0.3"

[dev-dependencies]
tempfile = "3.17"
wiremock = "0.6"
